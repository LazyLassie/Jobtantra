spring:
  config:
    activate:
      on-profile: test
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

jobtantra:
  auth:
    jwt-secret: ${JWT_SECRET:test-jobtantra-jwt-secret-at-least-32-bytes}
    token-ttl-seconds: 3600

logging:
  level:
    com.jobtantra: INFO
