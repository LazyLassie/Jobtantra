spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/jobtantra}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:Pr@churya#28}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

jobtantra:
  auth:
    jwt-secret: ${JWT_SECRET:}
    token-ttl-seconds: ${JWT_TTL_SECONDS:3600}
    bootstrap-admin:
      username: ${BOOTSTRAP_ADMIN_USERNAME:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}

logging:
  level:
    com.jobtantra: DEBUG
    org.springframework.security: INFO
